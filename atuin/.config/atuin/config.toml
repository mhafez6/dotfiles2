# Stow-managed Atuin config.

auto_sync = true
sync_frequency = "10m"
search_mode = "fuzzy"
filter_mode = "global"
style = "compact"
inline_height = 20
show_preview = true
enter_accept = true
history_filter = [
  "^export BAZAAR_API_KEY=",
  "^ANTHROPIC_API_KEY=.*BAZAAR_API_KEY",
]

[sync]
records = true

[daemon]
enabled = false
autostart = false
